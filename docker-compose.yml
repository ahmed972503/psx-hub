services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: psx
      POSTGRES_PASSWORD: psx_dev_password
      POSTGRES_DB: psx_hub
    ports:
      - "5433:5432"
    volumes:
      - psx_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psx -d psx_hub"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - psx_redis:/data

volumes:
  psx_pg:
  psx_redis:
